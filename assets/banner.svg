<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: url(#accent-grad);
        letter-spacing: -1px;
      }
      
      .text-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }

      .text-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }

      .pulse-circle {
        animation: pulse 3s ease-in-out infinite;
      }

      .float-node {
        animation: float 4s ease-in-out infinite;
      }

      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }

      .wave-line {
        animation: wave 6s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }

      @keyframes wave {
        0% { transform: scaleY(1) translateY(0); }
        100% { transform: scaleY(1.1) translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)" />
  <rect width="1196" height="296" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Grid Background Accent -->
  <g opacity="0.15">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200" stroke="#334155" stroke-width="1" />
    <path d="M100,0 V300 M200,0 V300 M300,0 V300 M400,0 V300 M500,0 V300 M600,0 V300 M700,0 V300 M800,0 V300 M900,0 V300 M1000,0 V300 M1100,0 V300" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#0284c7" opacity="0.15" filter="url(#soft-glow)" />
  <circle cx="1050" cy="220" r="140" fill="#6366f1" opacity="0.15" filter="url(#soft-glow)" />

  <!-- Connecting Wave / Flow lines -->
  <path d="M 600,150 C 700,80 800,220 950,150" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" class="wave-line" />
  <path d="M 650,170 C 750,100 850,240 1000,170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" class="wave-line" />

  <!-- Diagram Graphic on Right Side -->
  <g transform="translate(680, 40)">
    <!-- Connection Line -->
    <path d="M 120,110 L 280,110" stroke="#818cf8" stroke-width="3" class="dash-flow" filter="url(#glow)" />
    
    <!-- Browser / Extension Node -->
    <g class="float-node" style="animation-delay: 0s;">
      <rect x="30" y="50" width="140" height="120" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
      <!-- Browser Top Bar -->
      <path d="M 30,62 a 12,12 0 0 1 12,-12 h 116 a 12,12 0 0 1 12,12 v 18 h -140 z" fill="#1e293b" />
      <circle cx="48" cy="62" r="4" fill="#ef4444" />
      <circle cx="60" cy="62" r="4" fill="#eab308" />
      <circle cx="72" cy="62" r="4" fill="#22c55e" />
      <!-- Browser Content / Extension Logo -->
      <rect x="45" y="90" width="110" height="10" rx="3" fill="#334155" />
      <rect x="45" y="108" width="80" height="10" rx="3" fill="#0284c7" />
      <rect x="45" y="126" width="95" height="10" rx="3" fill="#334155" />
      <text x="100" y="195" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Browser / Extension</text>
    </g>

    <!-- WebSocket Bridge Node Center Badge -->
    <g transform="translate(200, 110)" class="pulse-circle">
      <circle cx="0" cy="0" r="22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
      <path d="M-8,-5 L-2,3 L8,-7" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-8,5 L2,-3 L8,5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="38" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">WS BRIDGE</text>
    </g>

    <!-- CLI Terminal Node -->
    <g class="float-node" style="animation-delay: -2s;">
      <rect x="230" y="50" width="140" height="120" rx="12" fill="#090d16" stroke="#c084fc" stroke-width="2" filter="url(#glow)" />
      <!-- Terminal Header -->
      <path d="M 230,62 a 12,12 0 0 1 12,-12 h 116 a 12,12 0 0 1 12,12 v 18 h -140 z" fill="#1e1e2e" />
      <text x="245" y="66" fill="#6c7086" font-family="monospace" font-size="11">&gt;_ bash</text>
      <!-- Terminal Content -->
      <text x="245" y="95" fill="#a6e3a1" font-family="monospace" font-size="12">$ chatgpt-cli</text>
      <text x="245" y="115" fill="#89dceb" font-family="monospace" font-size="11">&gt; prompt ready</text>
      <text x="245" y="135" fill="#f9e2af" font-family="monospace" font-size="11">✔ code extracted</text>
      <rect x="342" y="125" width="7" height="12" fill="#c084fc">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
      <text x="300" y="195" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">Python CLI</text>
    </g>
  </g>

  <!-- Left Side Main Title & Content -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="180" height="28" rx="14" fill="#0f2942" stroke="#0284c7" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="19" class="text-badge">RPA BROWSER BRIDGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="text-title" filter="url(#glow)">chatgpt-website-to-cli</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="text-subtitle">Automate Chatgpt Website interactions cleanly via local WebSocket bridge</text>

    <!-- Tech Tags / Badges -->
    <g transform="translate(0, 210)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="50" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">Python CLI</text>
      
      <!-- Tag 2 -->
      <rect x="110" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="170" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">Edge Extension</text>
      
      <!-- Tag 3 -->
      <rect x="240" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="295" y="17" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">WebSocket</text>
    </g>
  </g>
</svg>
